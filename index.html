<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Simultaneous Kibitz - Refactored</title>
<style>
body { margin:0; background:#1a1a1a; color:white; text-align:center; font-family:sans-serif; }
#uiContainer { display:flex; flex-direction:column; align-items:center; gap:8px; margin:10px; }
canvas { background:#0f172a; border-radius:8px; box-shadow:0 4px 12px rgba(0,0,0,.5); cursor:pointer; }
.panel { background:#2a2a2a; padding:10px 20px; border-radius:6px; display:flex; gap:15px; align-items:center; flex-wrap:wrap; justify-content:center; }
button { background:#4f46e5; color:white; border:0; padding:8px 16px; border-radius:4px; cursor:pointer; font-weight:bold; }
button:disabled { background:#555; cursor:not-allowed; }
#turnIndicator { font-weight:bold; font-size:1.1em; border:2px solid; }
.unit-toggle { background:#374151; border:1px solid #4b5563; padding:6px 12px; }
.unit-toggle.active { background:#059669; border-color:#10b981; }
#gameLog { background:#1f2937; padding:10px; border-radius:6px; max-height:150px; overflow-y:auto; text-align:left; width:80%; font-family:monospace; font-size:12px; }
.gameLogEntry { color:#fff; margin:2px 0; padding:2px 4px; border-radius:2px; }
.log-attack { color:#f59e0b; }
.log-defend { color:#3b82f6; }
.log-victory { color:#10b981; font-weight:bold; }
.log-defeat { color:#ef4444; font-weight:bold; }
.log-growth { color:#8b5cf6; }
.log-error { color:#ef4444; }
#stateOutput { width:80%; max-height:250px; overflow:auto; box-sizing:border-box; background:#111827; color:#d1d5db; padding:10px; border-radius:6px; text-align:left; font-size:11px; white-space:pre-wrap; }
</style>
</head>
<body>
<h1>Simultaneous Kibitz - Refactored</h1>

<div id="uiContainer">
    <div id="turnIndicator" class="panel"></div>

    <div class="panel">
        <label for="ratioSlider">Civilian Ratio (%): </label>
        💂 Soldier
        <input type="range" id="ratioSlider" min="0" max="100" step="25" value="50">
        🧑‍🌾 Civilian
        <span id="ratioValue">50%</span>
    </div>

    <div id="populationStatus" class="panel"></div>

    <div id="orderPanel" class="panel" style="display:none;">
        <span id="orderInfo">Select Target Tile</span>
        <div>
            <button id="toggleSoldierBtn" class="unit-toggle active">💂 Soldier</button>
            <button id="toggleCivilianBtn" class="unit-toggle">🧑‍🌾 Civilian</button>
        </div>
        <input type="number" id="unitCountInput" min="1" value="1" style="width:50px;">
        <button id="confirmOrderBtn">Send Units</button>
        <button id="cancelOrderBtn">Cancel</button>
    </div>

    <canvas id="gameCanvas" width="800" height="600"></canvas>

    <div class="panel">
        <button id="endTurnBtn">Submit Orders</button>
    </div>

    <h3>Game Log</h3>
    <div id="gameLog"></div>

    <div class="panel" style="width:80%;box-sizing:border-box;">
        <button id="showStateBtn">Show Game State JSON</button>
        <button id="simulateEmptyBtn">Simulate Empty Turn</button>
    </div>

    <pre id="stateOutput"></pre>
</div>

<!-- Application bootstrap. All game/UI behavior lives in the JS modules. -->
<script type="module" src="./main.js"></script>
</body>
</html>
