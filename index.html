## Game Rules
### Each player submits their turn simultaneously, then the game engine processes all turns and updates the board state.

### Starting Setup:
    - Each player starts with 1 tile
    - The player can see the tile they own and all adjacent tiles
    - On the starting tile, each player has 2 civilians and 1 baby
    - The player can choose (via slider) what percentage of babies become civilians or soldiers

### Player Turn:
    - Players can adjust their civilian/soldier ratio
    - Players can attempt to claim an unowned adjacent tile by moving one or more soldiers to it.
    - Players can move civilians to owned tiles to increase their population.

### Game Engine:
    - Once all players have submitted their turns, the game engine processes the moves and updates the board state
    - Any tiles with multiple players attempting to claim them will be resolved via a conflict resolution mechanic (currently dice rolls)
    - Conflicts are resolved similar to Risk (for now, 6 sided die rolls)
        - If a player owns the tile, they have defender advantage
        - If the tile is unowned, the larger army has advantage
        - Ties are re-rolled until a winner is determined
    - There can only be one owner per tile, and the winner of the conflict takes ownership of the tile
    - Any existing babies on a tile will grow into civilians or soldiers based on the player's chosen ratio
    - New babies are generated on each tile based on the number of civilians present (1 baby per 2 civilians)

### Execution Flow:
    - Validate & Reserve
        - Validate all orders submitted and pull moving units into an in-transit pool
    - Movement & Relocation
        - Relocate civilians to friendly target tiles
    - Conflict Resolution
        - Resolve conflicts and tile ownership from attacking/reinforcing soldier pools
    - Population Management
        - Kill civilians on lost tiles
        - Mature babies
        - Generate new babies
    - Win Condition Check
        - Evaluate active players and declare winner if only one survives

### Known Bugs:
    - Was able to send non-existent "ghost soldiers" to tile through UI (game engine caught it)
        - Once the Game engine encounters illegal move, "❌ Player 1: submitted 4 units from -2,0, but only 3 are available." there is no way to resolve.
        - Preserved as-is through the file split below; not something this refactor touches.

## CODING NOTES
### Design Pattern (this pass: split into html/css/js, and state vs. rules):
    - index.html    -- DOM skeleton only
    - style.css      -- all styling
    - js/geometry.js -- Tile, HexBoard: pure hex-grid math, no rules or ownership
    - js/state.js    -- Player, TilePopulation, GameLog, GameState: pure data, no rules
    - js/rules.js    -- Order, ConflictResolver, GameRules: all turn-resolution logic,
                        takes a GameState as an explicit argument rather than owning one
    - js/engine.js   -- GameEngine: owns the one authoritative GameState + GameRules pair,
                        the only surface UI (or a future AI harness / server) talks to
    - js/render.js   -- BoardRenderer: canvas drawing only, no rules knowledge
    - js/ui.js       -- GameUI: DOM/canvas interaction only, talks to GameEngine
    - js/main.js     -- bootstrap

    Loaded as ES modules (type="module"), so this needs to be served over
    http(s) -- opening index.html directly as a file:// URL will fail due
    to CORS restrictions on module imports.

### TO DO:
